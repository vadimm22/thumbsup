<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAIN</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            font-weight: 400;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .upload-corner {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 100;
            background: #000000;
            border: 1px solid #333333;
        }

        .file-input-wrapper {
            position: relative;
            cursor: pointer;
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-button {
            background: #000000;
            color: #e94560;
            padding: 4px 6px;
            font-size: 10px;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
        }

        .file-input-button:hover {
            background: #111111;
        }

        .title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3em;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
            margin: 30px 0;
            letter-spacing: 8px;
        }

        .central-image {
            text-align: center;
            margin: 40px 0;
        }

        .central-frame {
            display: inline-block;
            background: #000000;
            border: 2px solid #333333;
            max-width: 500px;
        }

        .central-image img {
            width: 100%;
            max-width: 500px;
            height: 300px;
            object-fit: cover;
        }

        .central-placeholder {
            width: 500px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            border: 1px solid #333333;
            color: #333333;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .folders-section {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin: 50px 0;
        }

        .folder {
            background: #000000;
            border: 2px solid #333333;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.1s ease;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .folder:hover {
            border-color: #666666;
        }

        .folder-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .folder-count {
            color: #333333;
            font-size: 10px;
            font-weight: 400;
        }

        .folder-denial .folder-name {
            color: #e94560;
        }

        .folder-anger .folder-name {
            color: #e94560;
        }

        .folder-bargaining .folder-name {
            color: #e94560;
        }

        .folder-depression .folder-name {
            color: #ffff00;
        }

        .folder-acceptance .folder-name {
            color: #e94560;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 50px;
        }

        .photo-item {
            background: #000000;
            border: 1px solid #333333;
            transition: border-color 0.1s ease;
        }

        .photo-item:hover {
            border-color: #666666;
        }

        .photo-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }

        .photo-info {
            padding: 15px;
            background: #000000;
        }

        .photo-name {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 11px;
            word-break: break-all;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
        }

        .photo-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .folder-select {
            background: #000000;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 5px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            flex: 1;
        }

        .folder-select:hover {
            border-color: #666666;
        }

        .delete-btn {
            background: #000000;
            color: #e94560;
            border: 1px solid #333333;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            transition: border-color 0.1s ease;
        }

        .delete-btn:hover {
            border-color: #666666;
        }

        .stats {
            background: #000000;
            color: #ffffff;
            padding: 15px 20px;
            border: 1px solid #333333;
            display: inline-block;
            margin: 30px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-gallery {
            text-align: center;
            color: #333333;
            font-size: 14px;
            margin: 60px 0;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .section-divider {
            width: 100%;
            height: 2px;
            background: #333333;
            margin: 40px 0;
        }

        @media (max-width: 1024px) {
            .folders-section {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2em;
                letter-spacing: 4px;
            }
            
            .folders-section {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .central-placeholder {
                width: 300px;
                height: 200px;
            }
            
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .folders-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="upload-corner">
        <div class="file-input-wrapper">
            <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
            <div class="file-input-button">
                +
            </div>
        </div>
    </div>

    <div class="container">
        <h1 class="title">PAIN</h1>
        
        <div class="central-image">
            <div class="central-frame" id="centralFrame">
                <div class="central-placeholder">
                    MAIN IMAGE
                </div>
            </div>
        </div>

        <div class="folders-section">
            <div class="folder folder-denial" onclick="toggleFolder('denial')">
                <div class="folder-name">DENIAL</div>
                <div class="folder-count" id="denialCount">0 IMAGES</div>
            </div>
            <div class="folder folder-anger" onclick="toggleFolder('anger')">
                <div class="folder-name">ANGER</div>
                <div class="folder-count" id="angerCount">0 IMAGES</div>
            </div>
            <div class="folder folder-bargaining" onclick="toggleFolder('bargaining')">
                <div class="folder-name">BARGAINING</div>
                <div class="folder-count" id="bargainingCount">0 IMAGES</div>
            </div>
            <div class="folder folder-depression" onclick="toggleFolder('depression')">
                <div class="folder-name">DEPRESSION</div>
                <div class="folder-count" id="depressionCount">0 IMAGES</div>
            </div>
            <div class="folder folder-acceptance" onclick="toggleFolder('acceptance')">
                <div class="folder-name">ACCEPTANCE</div>
                <div class="folder-count" id="acceptanceCount">0 IMAGES</div>
            </div>
        </div>

        <div class="section-divider"></div>

        <div class="stats">
            TOTAL IMAGES: <span id="photoCount">0</span>
        </div>

        <div id="gallery" class="gallery">
            <div class="empty-gallery">
                EMPTY ARCHIVE
            </div>
        </div>
    </div>

    <script>
        let photos = [];
        let centralPhoto = null;
        let currentFolder = 'all';
        let folders = {
            denial: [],
            anger: [],
            bargaining: [],
            depression: [],
            acceptance: []
        };

        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const photoCount = document.getElementById('photoCount');
        const centralFrame = document.getElementById('centralFrame');

        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const photo = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            data: e.target.result,
                            folder: 'all'
                        };
                        
                        photos.push(photo);
                        
                        if (!centralPhoto) {
                            setCentralPhoto(photo);
                        }
                        
                        updateGallery();
                        updateFolderCounts();
                    };
                    reader.readAsDataURL(file);
                }
            });

            event.target.value = '';
        }

        function setCentralPhoto(photo) {
            centralPhoto = photo;
            centralFrame.innerHTML = `<img src="${photo.data}" alt="${photo.name}">`;
        }

        function toggleFolder(folderName) {
            currentFolder = currentFolder === folderName ? 'all' : folderName;
            updateGallery();
        }

        function updateGallery() {
            photoCount.textContent = photos.length;

            if (photos.length === 0) {
                gallery.innerHTML = '<div class="empty-gallery">EMPTY ARCHIVE</div>';
                return;
            }

            let displayPhotos = photos;
            if (currentFolder !== 'all') {
                displayPhotos = folders[currentFolder];
            }

            gallery.innerHTML = displayPhotos.map(photo => `
                <div class="photo-item">
                    <img src="${photo.data}" alt="${photo.name}" onclick="setCentralPhoto(${JSON.stringify(photo).replace(/"/g, '&quot;')})">
                    <div class="photo-info">
                        <div class="photo-name">${photo.name}</div>
                        <div class="photo-controls">
                            <select class="folder-select" onchange="moveToFolder('${photo.id}', this.value)">
                                <option value="all" ${photo.folder === 'all' ? 'selected' : ''}>ALL</option>
                                <option value="denial" ${photo.folder === 'denial' ? 'selected' : ''}>DENIAL</option>
                                <option value="anger" ${photo.folder === 'anger' ? 'selected' : ''}>ANGER</option>
                                <option value="bargaining" ${photo.folder === 'bargaining' ? 'selected' : ''}>BARGAINING</option>
                                <option value="depression" ${photo.folder === 'depression' ? 'selected' : ''}>DEPRESSION</option>
                                <option value="acceptance" ${photo.folder === 'acceptance' ? 'selected' : ''}>ACCEPTANCE</option>
                            </select>
                            <button class="delete-btn" onclick="deletePhoto('${photo.id}')">
                                DEL
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function moveToFolder(photoId, folderName) {
            const photo = photos.find(p => p.id == photoId);
            if (photo) {
                if (photo.folder !== 'all') {
                    folders[photo.folder] = folders[photo.folder].filter(p => p.id != photoId);
                }
                
                photo.folder = folderName;
                if (folderName !== 'all') {
                    folders[folderName].push(photo);
                }
                
                updateGallery();
                updateFolderCounts();
            }
        }

        function updateFolderCounts() {
            document.getElementById('denialCount').textContent = `${folders.denial.length} IMAGES`;
            document.getElementById('angerCount').textContent = `${folders.anger.length} IMAGES`;
            document.getElementById('bargainingCount').textContent = `${folders.bargaining.length} IMAGES`;
            document.getElementById('depressionCount').textContent = `${folders.depression.length} IMAGES`;
            document.getElementById('acceptanceCount').textContent = `${folders.acceptance.length} IMAGES`;
        }

        function deletePhoto(photoId) {
            if (confirm('DELETE THIS IMAGE?')) {
                photos = photos.filter(photo => photo.id != photoId);
                
                Object.keys(folders).forEach(key => {
                    folders[key] = folders[key].filter(photo => photo.id != photoId);
                });
                
                if (centralPhoto && centralPhoto.id == photoId) {
                    centralPhoto = photos.length > 0 ? photos[0] : null;
                    if (centralPhoto) {
                        setCentralPhoto(centralPhoto);
                    } else {
                        centralFrame.innerHTML = '<div class="central-placeholder">MAIN IMAGE</div>';
                    }
                }
                
                updateGallery();
                updateFolderCounts();
            }
        }
    </script>
</body>
</html>
